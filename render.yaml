services:
  # Backend API (FastAPI + yt-dlp + FFmpeg via imageio-ffmpeg)
  - type: web
    name: vvideosdownloaderpro-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"

  # Frontend Web (Next.js 16)
  - type: web
    name: vvideosdownloaderpro-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: vvideosdownloaderpro-api
          property: host
